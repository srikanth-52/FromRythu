{% extends 'base.html' %}
{% load static %}

{% block title %}Customer Sign Up - FromRythu{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="card border-0 shadow-lg rounded-4 overflow-hidden border-top border-5 border-primary">
        <div class="p-4 text-white" style="background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);">
          <div class="d-flex align-items-center gap-3">
            <div class="rounded-circle bg-white text-primary d-flex align-items-center justify-content-center" style="width: 54px; height: 54px; font-size: 1.8rem;">
              <i class="bi bi-bag-heart"></i>
            </div>
            <div>
              <h3 class="fw-bold mb-0">Customer Account Sign Up</h3>
              <p class="small text-light opacity-90 mb-0">Get pure, fresh farm produce delivered directly from local farmers</p>
            </div>
          </div>
        </div>

        <div class="card-body p-4 p-md-5">
          <form method="POST" class="needs-validation" novalidate>
            {% csrf_token %}

            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label class="form-label fw-semibold">Your Full Name *</label>
                <input type="text" name="first_name" class="form-control" placeholder="e.g. Anita Sharma" required>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Username *</label>
                <input type="text" name="username" class="form-control" placeholder="e.g. customer_anita" required>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Mobile Phone Number *</label>
                <input type="text" name="phone_number" class="form-control" placeholder="e.g. 9885012345" required>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Email Address *</label>
                <input type="email" name="email" class="form-control" placeholder="anita@gmail.com" required>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Password *</label>
                <input type="password" name="password1" class="form-control" placeholder="••••••••" required>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Confirm Password *</label>
                <input type="password" name="password2" class="form-control" placeholder="••••••••" required>
              </div>
              <div class="col-12">
                <label class="form-label fw-semibold">Delivery Address *</label>
                <textarea name="shipping_address" class="form-control" rows="2" placeholder="House/Flat No, Apartment, Street, Landmark" required></textarea>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold">City / Town *</label>
                <input type="text" name="city" class="form-control" placeholder="e.g. Hyderabad" required>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold">Postal PIN Code *</label>
                <input type="text" name="pincode" class="form-control" placeholder="500081" required>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold">State *</label>
                <input type="text" name="state" class="form-control" value="Telangana" required>
              </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100 py-3 fw-bold shadow">
              <i class="bi bi-cart-check me-2"></i> Register & Start Buying Direct
            </button>
          </form>

          <div class="text-center mt-4 small">
            Already have an account? <a href="{% url 'accounts:customer_login' %}" class="text-primary fw-bold">Sign In</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
