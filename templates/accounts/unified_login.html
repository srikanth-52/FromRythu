<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | FromRythu</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

  <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">

    <div class="card border-0 shadow-sm rounded-4 w-100" style="max-width:680px">

      <div class="card-body p-4 p-md-5">

        <h2 class="fw-bold text-center">
          Welcome to FromRythu
        </h2>

        <p class="text-secondary text-center mb-4">
          Choose your account type to continue.
        </p>

        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }}">
          {{ message }}
        </div>
        {% endfor %}
        {% endif %}

        <div class="row g-3">

          <!-- Farmer Login -->
          <div class="col-md-6">

            <div class="card h-100 border-success">
              <div class="card-body text-center p-3">

                <h5 class="fw-bold mb-3">
                  Farmer
                </h5>

                <p class="text-secondary small">
                  Manage your farm and products.
                </p>

                <a href="{% url 'accounts:farmer_login' %}" class="btn btn-success w-100 py-2">
                  Farmer Login
                </a>

              </div>
            </div>

          </div>

          <!-- Customer Login -->
          <div class="col-md-6">

            <div class="card h-100 border-success">
              <div class="card-body text-center p-3">

                <h5 class="fw-bold mb-3">
                  Customer
                </h5>

                <p class="text-secondary small">
                  Shop fresh produce from farmers.
                </p>

                <a href="{% url 'accounts:customer_login' %}" class="btn btn-outline-success w-100 py-2">
                  Customer Login
                </a>

              </div>
            </div>

          </div>

        </div>

        <p class="text-center mt-4 mb-0">
          New to FromRythu?

          <a href="{% url 'accounts:register' %}">
            Create an account
          </a>
        </p>

      </div>
    </div>

  </main>

</body>

</html>
